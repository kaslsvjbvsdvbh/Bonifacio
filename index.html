<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Treino — Upper/Lower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15171A;
    --surface: #1E2124;
    --surface-2: #26292C;
    --line: #35393C;
    --text: #ECE8E1;
    --muted: #93989C;
    --accent: #C9A227;
    --accent-dim: #8A6F1C;
    --danger: #B3503A;
    --good: #6B8F5C;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #F2F0EB;
    --surface: #FFFFFF;
    --surface-2: #E9E6DF;
    --line: #D8D3C8;
    --text: #1C1D1B;
    --muted: #6B6F72;
    --accent: #9C7D16;
    --accent-dim: #C9A227;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--bg);
  }

  .shell {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 18px 48px;
  }

  header.top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--bg);
    padding: 18px 0 10px;
    border-bottom: 1px solid var(--line);
  }
  header.top .eyebrow {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.06em;
    font-size: 13px;
    color: var(--accent);
    margin: 0 0 2px;
  }
  header.top h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 34px;
    line-height: 1;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .title-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin: 0 0 14px;
  }
  .hist-btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12px;
    border-radius: 3px;
    padding: 7px 10px;
    cursor: pointer;
  }
  .hist-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .hist-card h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 18px;
    margin: 0 0 2px;
  }
  .hist-date {
    font-size: 11.5px;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .hist-ex {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 3px 0;
    border-top: 1px solid var(--line);
  }
  .hist-ex:first-of-type { border-top: none; }
  .hist-ex .nm { color: var(--text); }
  .hist-ex .vl { color: var(--muted); font-variant-numeric: tabular-nums; }
  .hist-copy {
    margin-top: 10px;
    font-size: 12px;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
  }
  .empty-hist {
    color: var(--muted);
    font-size: 13.5px;
    padding: 20px 0;
    text-align: center;
  }

  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .tab {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 3px;
    padding: 9px 4px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    text-align: center;
    line-height: 1.2;
  }
  .tab span { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); margin-top: 1px; }
  .tab.active {
    border-color: var(--accent);
    color: var(--text);
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .tab.active span { color: var(--accent); }

  .day-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 22px 0 10px;
  }
  .day-head h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-weight: 400;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .day-head .count {
    font-size: 12.5px;
    color: var(--muted);
  }

  .ex-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 14px 12px;
    margin-bottom: 10px;
  }
  .ex-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .ex-name {
    font-weight: 700;
    font-size: 15.5px;
    margin: 0 0 2px;
  }
  .ex-target {
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .ex-link {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
    white-space: nowrap;
    border: 1px solid var(--accent-dim);
    border-radius: 3px;
    padding: 5px 8px;
    flex-shrink: 0;
  }
  .ex-link:active { background: var(--surface-2); }

  .ex-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .sets {
    display: flex;
    gap: 6px;
  }
  .set-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
  }
  .set-btn.done {
    background: var(--good);
    border-color: var(--good);
    color: #15171A;
  }
  .weight-field {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
  }
  .weight-field input {
    width: 58px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    padding: 6px 7px;
    font-size: 13.5px;
    text-align: right;
  }
  .weight-field label { font-size: 11.5px; color: var(--muted); }
  .last-load {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }
  .last-load b { color: var(--text); }

  .footer-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .btn {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    border-radius: 4px;
    padding: 12px;
    cursor: pointer;
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #15171A;
  }
  .btn.theme {
    flex: none;
    width: 44px;
    font-size: 16px;
    padding: 12px 0;
  }

  .toast {
    position: fixed;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--surface-2);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 4px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    z-index: 20;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <p class="eyebrow">HIPERTROFIA &amp; CALISTENIA — 4 DIAS</p>
    <div class="title-row">
      <h1>Painel de Treino</h1>
      <button class="hist-btn" id="historyBtn" title="Ver histórico">Histórico</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <div id="trainView">
  <div class="day-head">
    <h2 id="dayTitle"></h2>
    <span class="count" id="dayCount"></span>
  </div>

  <div id="exList"></div>

  <div class="footer-actions">
    <button class="btn" id="resetBtn">Limpar sets de hoje</button>
    <button class="btn primary" id="finishBtn">Concluir treino</button>
    <button class="btn theme" id="themeBtn" title="Alternar tema">◐</button>
  </div>
  </div>

  <div id="historyView" style="display:none">
    <div class="day-head">
      <h2>Histórico de treinos</h2>
      <span class="count" id="histCount"></span>
    </div>
    <div class="footer-actions">
      <button class="btn" id="copyAllBtn">Copiar histórico completo</button>
    </div>
    <div id="histList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORKOUTS = [
  {
    id: 'sup-a',
    label: 'Superior A',
    sub: 'Puxada + Empurrão',
    exercises: [
      { name: 'Barra fixa pronada', sets: 4, reps: '5' },
      { name: 'Paralelas com inclinação', sets: 4, reps: '8' },
      { name: 'Remada baixa ou serrote', sets: 4, reps: '10' },
      { name: 'Supino reto com halteres', sets: 4, reps: '10' },
      { name: 'Flexão declinada', sets: 3, reps: '10' },
      { name: 'Rosca alternada inclinado', sets: 3, reps: '12' },
    ]
  },
  {
    id: 'inf-a',
    label: 'Inferior A',
    sub: 'Quadríceps + Core',
    exercises: [
      { name: 'Agachamento livre', sets: 4, reps: '8' },
      { name: 'Leg Press ou Avanço', sets: 3, reps: '10' },
      { name: 'Cadeira extensora', sets: 4, reps: '12' },
      { name: 'Panturrilha em pé', sets: 4, reps: '15' },
      { name: 'Abdominal infra pendurado', sets: 4, reps: '10' },
    ]
  },
  {
    id: 'sup-b',
    label: 'Superior B',
    sub: 'Ombro + Costas',
    exercises: [
      { name: 'Desenvolvimento militar', sets: 4, reps: '8' },
      { name: 'Chin-up supinada', sets: 4, reps: '6' },
      { name: 'Elevação lateral', sets: 4, reps: '12' },
      { name: 'Remada curvada aberta', sets: 3, reps: '10' },
      { name: 'Tríceps na polia', sets: 3, reps: '12' },
      { name: 'Crucifixo invertido', sets: 3, reps: '12' },
    ]
  },
  {
    id: 'inf-b',
    label: 'Inferior B',
    sub: 'Posterior + Core',
    exercises: [
      { name: 'RDL / Stiff', sets: 4, reps: '8' },
      { name: 'Mesa flexora', sets: 4, reps: '10' },
      { name: 'Elevação pélvica', sets: 3, reps: '10' },
      { name: 'Panturrilha sentada', sets: 4, reps: '15' },
      { name: 'Prancha com carga / Roda abdominal', sets: 3, reps: 'máx' },
    ]
  },
];

const STORE_KEY = 'painel-treino-upper-lower-v1';
let state = { active: 0, theme: 'dark', progress: {}, loads: {}, history: [] };
let activeDate = todayKey();
let view = 'train';

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  } catch (e) { console.warn('Falha ao ler estado local', e); }
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { console.warn('Falha ao salvar estado local', e); }
}

function progressKey(wId, exIdx) { return wId + '::' + exIdx + '::' + activeDate; }
function loadKey(wId, exIdx) { return wId + '::' + exIdx; }

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  WORKOUTS.forEach((w, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === state.active ? ' active' : '');
    b.innerHTML = w.label + '<span>' + w.sub + '</span>';
    b.onclick = () => { state.active = i; saveState(); render(); };
    tabs.appendChild(b);
  });
}

function render() {
  renderTabs();
  const w = WORKOUTS[state.active];
  document.getElementById('dayTitle').textContent = w.label;
  document.getElementById('dayCount').textContent = w.exercises.length + ' exercícios';

  const list = document.getElementById('exList');
  list.innerHTML = '';

  w.exercises.forEach((ex, idx) => {
    const pKey = progressKey(w.id, idx);
    const lKey = loadKey(w.id, idx);
    const done = state.progress[pKey] || 0;
    const lastLoad = state.loads[lKey];

    const card = document.createElement('div');
    card.className = 'ex-card';

    const ytQuery = encodeURIComponent(ex.name + ' execução técnica');
    card.innerHTML = `
      <div class="ex-top">
        <div>
          <p class="ex-name">${ex.name}</p>
          <p class="ex-target">${ex.sets} séries × ${ex.reps}</p>
        </div>
        <a class="ex-link" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${ytQuery}">ver execução</a>
      </div>
      <div class="ex-row">
        <div class="sets" data-sets></div>
        <div class="weight-field">
          <label>kg</label>
          <input type="number" inputmode="decimal" step="0.5" min="0" data-weight value="${lastLoad && lastLoad.value !== undefined ? lastLoad.value : ''}" placeholder="0">
        </div>
      </div>
      ${lastLoad ? `<p class="last-load">última carga (${lastLoad.date}): <b>${lastLoad.value} kg</b></p>` : ''}
    `;

    const setsWrap = card.querySelector('[data-sets]');
    for (let s = 1; s <= ex.sets; s++) {
      const btn = document.createElement('button');
      btn.className = 'set-btn' + (s <= done ? ' done' : '');
      btn.textContent = s;
      btn.onclick = () => {
        const current = state.progress[pKey] || 0;
        state.progress[pKey] = (s <= current) ? s - 1 : s;
        saveState();
        render();
      };
      setsWrap.appendChild(btn);
    }

    const weightInput = card.querySelector('[data-weight]');
    weightInput.addEventListener('change', () => {
      const v = parseFloat(weightInput.value);
      if (!isNaN(v)) {
        state.loads[lKey] = { value: v, date: activeDate };
        saveState();
      }
    });

    list.appendChild(card);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('resetBtn').onclick = () => {
  const w = WORKOUTS[state.active];
  w.exercises.forEach((ex, idx) => { delete state.progress[progressKey(w.id, idx)]; });
  saveState();
  render();
  showToast('Sets de hoje zerados');
};

document.getElementById('finishBtn').onclick = () => {
  const w = WORKOUTS[state.active];
  const entry = {
    date: activeDate,
    workoutId: w.id,
    workoutLabel: w.label,
    exercises: w.exercises.map((ex, idx) => ({
      name: ex.name,
      target: ex.sets + 'x' + ex.reps,
      setsDone: state.progress[progressKey(w.id, idx)] || 0,
      weight: state.loads[loadKey(w.id, idx)] ? state.loads[loadKey(w.id, idx)].value : null,
    })),
  };
  state.history = state.history.filter(h => !(h.date === entry.date && h.workoutId === entry.workoutId));
  state.history.unshift(entry);
  saveState();
  showToast('Treino registrado — bom trabalho!');
};

function formatEntry(e) {
  const lines = [e.workoutLabel + ' — ' + e.date];
  e.exercises.forEach(ex => {
    const w = ex.weight !== null && ex.weight !== undefined ? ex.weight + 'kg' : 'sem carga';
    lines.push('- ' + ex.name + ' (' + ex.target + '): ' + ex.setsDone + '/' + ex.target.split('x')[0] + ' séries, ' + w);
  });
  return lines.join('\n');
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast('Copiado!');
  } catch (e) {
    showToast('Não deu pra copiar automaticamente — selecione o texto manualmente.');
  }
}

function renderHistory() {
  const list = document.getElementById('histList');
  const count = document.getElementById('histCount');
  list.innerHTML = '';
  count.textContent = state.history.length + (state.history.length === 1 ? ' sessão' : ' sessões');
  if (!state.history.length) {
    list.innerHTML = '<p class="empty-hist">Nenhum treino concluído ainda. Marque os sets e toque em "Concluir treino".</p>';
    return;
  }
  state.history.forEach(entry => {
    const card = document.createElement('div');
    card.className = 'hist-card';
    const exRows = entry.exercises.map(ex => {
      const w = ex.weight !== null && ex.weight !== undefined ? ex.weight + ' kg' : '—';
      return `<div class="hist-ex"><span class="nm">${ex.name}</span><span class="vl">${ex.setsDone}/${ex.target.split('x')[0]} · ${w}</span></div>`;
    }).join('');
    card.innerHTML = `
      <h3>${entry.workoutLabel}</h3>
      <p class="hist-date">${entry.date}</p>
      ${exRows}
      <button class="hist-copy" data-copy>Copiar esta sessão</button>
    `;
    card.querySelector('[data-copy]').onclick = () => copyText(formatEntry(entry));
    list.appendChild(card);
  });
}

function setView(v) {
  view = v;
  document.getElementById('trainView').style.display = v === 'train' ? '' : 'none';
  document.getElementById('historyView').style.display = v === 'history' ? '' : 'none';
  document.getElementById('historyBtn').textContent = v === 'train' ? 'Histórico' : 'Treino de hoje';
  if (v === 'history') renderHistory();
}

document.getElementById('historyBtn').onclick = () => setView(view === 'train' ? 'history' : 'train');
document.getElementById('copyAllBtn').onclick = () => {
  if (!state.history.length) { showToast('Nada pra copiar ainda'); return; }
  copyText(state.history.map(formatEntry).join('\n\n'));
};

document.getElementById('themeBtn').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  saveState();
};

loadState();
if (state.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
render();
</script>
</body>
</html>
